<div class="header-bar">
  <div class="top">
    <div class="top-content">
      <div class="logo-mini">S</div>
      <div class="header-title"><h1>Settings</h1></div>
    </div>
    <div class="user-badge">
      <span>{{getDisplayName()}}</span>
      <span class="pro-badge">{{driver.role}}</span>
    </div>
  </div>

  <nav class="tab-bar">
    <button type="button" (click)="setTab('account')" [class.active]="selectedTab==='account'">Account</button>
    <button type="button" (click)="setTab('profile')" [class.active]="selectedTab==='profile'">Profile</button>
  </nav>
</div>

<div class="content">
  <app-account *ngIf="selectedTab === 'account'"></app-account>
  <section class="profile-settings" *ngIf="selectedTab==='profile'">
    <app-driver-profile></app-driver-profile>
  </section>
</div>
