<!-- Header -->
<div class="flex items-center justify-center fixed top-0 left-0 w-full h-[60px] z-50 dark:bg-slate-900">
    <p class="text-xl font-bold text-white dark:text-white">GoSchool</p>
</div>
<!-- Page Wrapper -->
<div class="bg-gray-50 dark:bg-slate-900 pt-[60px] min-h-screen flex justify-center items-center">
    <div
        class="w-full md:w-2/6 py-10  mr-4 ml-4 border border-purple-400 border-t-[20px] border-b-4 border-b-purple-400 rounded-md shadow-md bg-white dark:bg-slate-900">
        <!-- Title -->
        <div class="text-center text-2xl md:text-3xl py-5 dark:text-gray-50">Login</div>

        <!-- Subtitle -->
        <div class="text-center text-sm py-2 dark:text-gray-400 mb-4">You can log in anytime using your credentials.
        </div>

        <!-- Form -->
        <form id="contact_us_form" (ngSubmit)="onSubmit()" [formGroup]="loginForm" class="space-y-6">
            <div class="space-y-5 ml-4 mr-4 px-3 md:px-0">

                <!-- Email -->
                <div class="relative">
                    <input type="text" name="email" id="email" autocomplete="off" formControlName="email"
                        class="px-4 py-2 peer w-full border border-purple-400 bg-gray-50 shadow-sm placeholder-transparent text-purple-600 focus:outline-none rounded-md focus:border-purple-600 focus:ring focus:ring-purple-300 focus:ring-opacity-50 dark:bg-slate-800 dark:text-gray-50"
                        placeholder="Enter Email" />
                    <label for="email"
                        class="bg-gray-50 px-2 absolute left-2 -top-3.5 text-gray-600 text-sm transition-all peer-focus:-top-3 peer-focus:bg-gray-50 peer-placeholder-shown:top-2 peer-placeholder-shown:text-base peer-placeholder-shown:text-gray-400 dark:peer-focus:bg-slate-800 dark:bg-slate-800 dark:text-gray-50">
                        Email
                    </label>
                    <div class="text-pink-600 text-sm"
                        *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid">
                        {{ getErrorMessage('email') }}
                    </div>
                </div>


                <!-- Password -->
                <div class="relative">
                    <input [type]="showPassword ? 'text' : 'password'" name="password" id="password" autocomplete="off"
                        formControlName="password"
                        class="px-4 py-2 peer w-full border border-purple-400 bg-gray-50 shadow-sm placeholder-transparent text-purple-600 focus:outline-none rounded-md focus:border-purple-600 focus:ring focus:ring-purple-300 focus:ring-opacity-50 dark:bg-slate-800 dark:text-gray-50"
                        placeholder="Enter Password" />

                    <!-- label -->
                    <label for="password"
                        class="bg-gray-50 px-2 absolute left-2 -top-3.5 text-gray-600 text-sm transition-all peer-focus:-top-3 peer-focus:bg-gray-50 peer-placeholder-shown:top-2 peer-placeholder-shown:text-base peer-placeholder-shown:text-gray-400 dark:peer-focus:bg-slate-800 dark:bg-slate-800 dark:text-gray-50">
                        Password
                    </label>

                    <!-- Eye icon -->
                    <button type="button" (click)="showPassword = !showPassword"
                        class="absolute right-3 top-[1.3rem] transform -translate-y-1/2 text-gray-400 transition-colors duration-300 p-1 rounded-md text-purple-300">
                        @if(showPassword){
                        <span><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                                stroke="currentColor" class="w-5 h-5">
                                <path stroke-linecap="round" stroke-linejoin="round"
                                    d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
                                <path stroke-linecap="round" stroke-linejoin="round"
                                    d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                            </svg></span>
                        }
                        @if (!showPassword) {
                        <span><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                                stroke="currentColor" class="w-5 h-5">
                                <path stroke-linecap="round" stroke-linejoin="round"
                                    d="M3.988 5.844A1.352 1.352 0 0 0 2.36 7.175l1.455 1.455A1.353 1.353 0 0 0 3.988 5.844ZM12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-1.232 0-2.435-.295-3.553-.84l4.244-4.243a3 3 0 1 0-4.243-4.243L3.988 5.844Z" />
                                <path stroke-linecap="round" stroke-linejoin="round"
                                    d="M14.25 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0ZM4.5 9.75l-1.5-1.5" />
                            </svg></span>
                        }
                    </button>
                    <!-- Error message -->
                    <div class="text-pink-600 text-sm"
                        *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid">
                        {{ getErrorMessage('password') }}
                    </div>
                    <div *ngIf="loginError" class="text-pink-600 text-sm" >
        
           
            {{ loginError }}
        
    </div>
                </div>
                <!-- Forgot Password Link -->
                <p class="text-right text-sm mt-3">
                    <a (click)="forgetPassword()"
                        class="text-gray-400 hover:text-gray-200 font-medium hover:underline transition-all duration-300">
                        Forgot Password?
                    </a>
                </p>
                <!-- Going to the back screen / forward one -->
                <div class="flex space-x-4">
                    <button type="submit" [disabled]="loading"
                        class="relative w-full flex items-center justify-center space-x-2 rounded-md bg-purple-600 hover:bg-purple-700 hover:shadow-md py-3 text-white disabled:opacity-60">
                        <svg *ngIf="loading" aria-hidden="true" class="w-5 h-5 mr-2 text-white animate-spin"
                            viewBox="0 0 100 101" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path
                                d="M100 50.5908C100 78.2051 77.6142 100.591 50 100.591C22.3858 100.591 0 78.2051 0 50.5908C0 22.9766 22.3858 0.59082 50 0.59082C77.6142 0.59082 100 22.9766 100 50.5908ZM9.08144 50.5908C9.08144 73.1895 27.4013 91.5094 50 91.5094C72.5987 91.5094 90.9186 73.1895 90.9186 50.5908C90.9186 27.9921 72.5987 9.67226 50 9.67226C27.4013 9.67226 9.08144 27.9921 9.08144 50.5908Z"
                                fill="currentColor" />
                            <path
                                d="M93.9676 39.0409C96.393 38.4038 97.8624 35.9116 97.0079 33.5539C95.2932 28.8227 92.871 24.3692 89.8167 20.348C85.8452 15.1192 80.8826 10.7238 75.2124 7.41289C69.5422 4.10194 63.2754 1.94025 56.7698 1.05124C51.7666 0.367541 46.6976 0.446843 41.7345 1.27873C39.2613 1.69328 37.813 4.19778 38.4501 6.62326C39.0873 9.04874 41.5694 10.4717 44.0505 10.1071C47.8511 9.54855 51.7191 9.52689 55.5402 10.0491C60.8642 10.7766 65.9928 12.5457 70.6331 15.2552C75.2735 17.9648 79.3347 21.5619 82.5849 25.841C84.9175 28.9121 86.7997 32.2913 88.1811 35.8758C89.083 38.2158 91.5421 39.6781 93.9676 39.0409Z"
                                fill="currentFill" />
                        </svg>

                        <span>{{ loading ? 'Logging in...' : 'Login' }}</span>
                    </button>

                </div>
                <p class="flex justify-center mt-6 text-sm text-gray-400">
                    Don&apos;t have an account?
                    <a (click)="register()"
                        class="ml-[5px] text-slate-600 hover:text-gray-200 font-medium hover:underline transition-all duration-300">
                        Sign up
                    </a>
                </p>
            </div>
        </form>
    </div>
</div>
