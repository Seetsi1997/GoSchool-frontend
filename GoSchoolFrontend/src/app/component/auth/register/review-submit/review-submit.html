<!-- Header -->
<div class="flex items-center justify-center fixed top-0 left-0 w-full h-[60px] z-50 dark:bg-slate-900">
    <p class="text-xl font-bold text-white dark:text-white">GoSchool</p>
</div>

<div class="bg-gray-50 dark:bg-slate-900 pt-[60px] min-h-screen flex justify-center items-center">
    <div
        class="w-full md:w-2/6 py-10  mr-4 ml-4  mt-4 mb-4 border border-purple-400 border-t-[20px] border-b-4 border-b-purple-400 rounded-md shadow-md bg-white dark:bg-slate-900">

        <!-- Title -->
        <div class="text-center text-2xl md:text-3xl py-5 dark:text-gray-50">Review</div>


        <!-- Subtitle -->
        <div class="text-center text-sm py-2 dark:text-gray-400 mb-4"> Review your details below.</div>

        <!-- Form Wrapper -->
        <div class="space-y-5 ml-4 mr-4 px-3 md:px-0">

            <!-- Register Info -->
            <div class="border-b pb-4 border-gray-400">
                <div class="text-gray-500 dark:text-gray-400 mb-2 font-semibold">Register Info</div>
                <p class="text-purple-600">Name: </p>
                <p class="text-purple-600">Contact: </p>
                <p class="text-purple-600">Email: </p>
            </div>

            <!-- Address Info -->
            <div class="border-b pb-4 border-gray-400">
                <div class="text-gray-500 dark:text-gray-400 mb-2 font-semibold">Address</div>
                <p class="text-purple-600">City: </p>
                <p class="text-purple-600">Address: </p>
                <p class="text-purple-600">Postal Code:</p>
                <p class="text-purple-600">Province: </p>
            </div>

            <!-- Account Info -->
            <div class="border-b pb-4 border-gray-400">
                <div class="text-gray-500 dark:text-gray-400 mb-2 font-semibold">Account</div>
                <p class="text-purple-600">Username: </p>
                <p class="text-purple-600">Email:</p>
                <p class="text-purple-600">Role:</p>
            </div>

            <!-- Buttons -->
            <div class="flex space-x-4 mt-4">
                <button type="button" (click)="goPrevious()"
                    class="w-full rounded-md bg-purple-600 hover:bg-purple-700 hover:shadow-md py-3 text-white">
                    Back
                </button>
                <button type="button"
                    class="w-full rounded-md bg-purple-600 hover:bg-purple-700 hover:shadow-md py-3 text-white">
                    Submit
                </button>
            </div>
        </div>
    </div>
</div>
