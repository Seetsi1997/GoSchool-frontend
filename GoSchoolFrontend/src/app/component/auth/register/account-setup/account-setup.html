<!-- Header -->
<div class="flex items-center justify-center fixed top-0 left-0 w-full h-[60px] z-50 dark:bg-slate-900">
    <p class="text-xl font-bold text-white dark:text-white">GoSchool</p>
</div>
<!-- Page Wrapper -->
<div class="bg-gray-50 dark:bg-slate-900 pt-[60px] min-h-screen flex justify-center items-center">
    <div
        class="w-full md:w-2/6 py-10 mr-4 ml-4 border border-purple-400 border-t-[20px] border-b-4 border-b-purple-400 rounded-md shadow-md bg-white dark:bg-slate-900">
        <!-- Title -->
        <div class="text-center text-2xl md:text-3xl py-5 dark:text-gray-50">Account Setup</div>

        <!-- Subtitle -->
        <div class="text-center text-sm py-2 dark:text-gray-400 mb-4"> Choose your role and create a password to finish.
        </div>

        <!-- Form -->
        <form id="contact_us_form" [formGroup]="form">
            <div class="space-y-5 ml-4 mr-4 px-3 md:px-0">
                <!-- Username -->
                <div class="relative">
                    <input type="text" name="firstName" id="firstName" autocomplete="off" [value]="form.get('firstName')?.value" readonly
                        class="px-4 py-2 peer w-full border border-purple-400 bg-gray-50 shadow-sm placeholder-transparent text-purple-600 focus:outline-none rounded-md focus:border-purple-600 focus:ring focus:ring-purple-300 focus:ring-opacity-50 dark:bg-slate-800 dark:text-gray-50"
                        placeholder="Enter Username" />
                    <!-- label -->
                    <label for="firstName"
                        class="bg-gray-50 px-2 absolute left-2 -top-3.5 text-gray-600 text-sm transition-all peer-focus:-top-3 peer-focus:bg-gray-50 peer-placeholder-shown:top-2 peer-placeholder-shown:text-base peer-placeholder-shown:text-gray-400 dark:peer-focus:bg-slate-800 dark:bg-slate-800 dark:text-gray-50">
                        Username
                    </label>
                    <!-- Error message -->
                    <div class="text-pink-600 text-sm"
                        *ngIf="form.get('firstName')?.touched && form.get('firstName')?.invalid">
                        {{ getErrorMessage('firstName') }}
                    </div>
                </div>

                <!-- Email -->
                <div class="relative">
                    <input type="text" name="email" id="email" autocomplete="off"
                        [value]="form.get('email')?.value" readonly
                        class="px-4 py-2 peer w-full border border-purple-400 bg-gray-50 shadow-sm placeholder-transparent text-purple-600 focus:outline-none rounded-md focus:border-purple-600 focus:ring focus:ring-purple-300 focus:ring-opacity-50 dark:bg-slate-800 dark:text-gray-50"
                        placeholder="Enter Email" />
                    <!-- label -->
                    <label for="email"
                        class="bg-gray-50 px-2 absolute left-2 -top-3.5 text-gray-600 text-sm transition-all peer-focus:-top-3 peer-focus:bg-gray-50 peer-placeholder-shown:top-2 peer-placeholder-shown:text-base peer-placeholder-shown:text-gray-400 dark:peer-focus:bg-slate-800 dark:bg-slate-800 dark:text-gray-50">
                        Email
                    </label>
                    <!-- Error message -->
                    <div class="text-pink-600 text-sm"
                        *ngIf="form.get('email')?.touched && form.get('email')?.invalid">
                        {{ getErrorMessage('email') }}
                    </div>
                </div>

                <!-- Password -->
                <div class="relative">
                    <input type="text" name="password" id="password" autocomplete="off" formControlName="password"
                        class="px-4 py-2 peer w-full border border-purple-400 bg-gray-50 shadow-sm placeholder-transparent text-purple-600 focus:outline-none rounded-md focus:border-purple-600 focus:ring focus:ring-purple-300 focus:ring-opacity-50 dark:bg-slate-800 dark:text-gray-50"
                        placeholder="Enter Password" />
                    <!-- label -->
                    <label for="password"
                        class="bg-gray-50 px-2 absolute left-2 -top-3.5 text-gray-600 text-sm transition-all peer-focus:-top-3 peer-focus:bg-gray-50 peer-placeholder-shown:top-2 peer-placeholder-shown:text-base peer-placeholder-shown:text-gray-400 dark:peer-focus:bg-slate-800 dark:bg-slate-800 dark:text-gray-50">
                        Password
                    </label>
                    <!-- Error message -->
                    <div class="text-pink-600 text-sm"
                        *ngIf="form.get('password')?.touched && form.get('password')?.invalid">
                        {{ getErrorMessage('password') }}
                    </div>
                </div>


                <!-- Confirm Password -->
                <div class="relative">
                    <input type="text" name="confirmPassword" id="confirmPassword" autocomplete="off"
                        formControlName="confirmPassword"
                        class="px-4 py-2 peer w-full border border-purple-400 bg-gray-50 shadow-sm placeholder-transparent text-purple-600 focus:outline-none rounded-md focus:border-purple-600 focus:ring focus:ring-purple-300 focus:ring-opacity-50 dark:bg-slate-800 dark:text-gray-50"
                        placeholder="Confirm Password" />
                    <!-- label -->
                    <label for="confirmPassword"
                        class="bg-gray-50 px-2 absolute left-2 -top-3.5 text-gray-600 text-sm transition-all peer-focus:-top-3 peer-focus:bg-gray-50 peer-placeholder-shown:top-2 peer-placeholder-shown:text-base peer-placeholder-shown:text-gray-400 dark:peer-focus:bg-slate-800 dark:bg-slate-800 dark:text-gray-50">
                        Confirm Password
                    </label>
                    <!-- Error message -->
                    <div class="text-pink-600 text-sm"
                        *ngIf="form.get('confirmPassword')?.touched && form.get('confirmPassword')?.invalid">
                        {{ getErrorMessage('confirmPassword') }}
                    </div>
                </div>

                <!-- Role -->
                <div class="relative">
                    <select formControlName="role"
                        class="px-4 py-2 peer w-full border border-purple-400 bg-gray-50 shadow-sm text-purple-600 rounded-md focus:outline-none focus:border-purple-600 focus:ring focus:ring-purple-300 focus:ring-opacity-50 dark:bg-slate-800 dark:text-gray-50">
                        <!-- Default option -->
                        <option value="" disabled selected>Select Role</option>

                        <!-- Provinces -->
                        <option *ngFor="let r of role" [value]="r">
                            {{ r.replace('_', ' ') }}
                        </option>
                    </select>

                    <!-- Floating label -->
                    <label class="absolute left-3 top-2 text-gray-400 pointer-events-none"
                        [class.hidden]="form.get('role')?.value">
                        Select a Role
                    </label>
                    <!-- Error message -->
                    <div class="text-pink-600 text-sm" *ngIf="form.get('role')?.touched && form.get('role')?.invalid">
                        {{ getErrorMessage('role') }}
                    </div>
                </div>

                <!-- Going to the back screen / forward one -->
                <div class="flex space-x-4">
                    <button type="button" (click)="goPrevious()"
                        class="w-full rounded-md bg-purple-600 hover:bg-purple-700 hover:shadow-md py-3 text-white">
                        Back
                    </button>
                    <button type="button" (click)="goNext()"
                        class="w-full rounded-md bg-purple-600 hover:bg-purple-700 hover:shadow-md py-3 text-white">
                        Next
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>
