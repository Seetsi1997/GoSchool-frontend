<!-- Header -->
<div class="flex items-center justify-center fixed top-0 left-0 w-full h-[60px] z-50 dark:bg-slate-900">
    <p class="text-xl font-bold text-white dark:text-white">GoSchool</p>
</div>
<!-- Page Wrapper -->
<div class="bg-gray-50 dark:bg-slate-900 pt-[60px] min-h-screen flex justify-center items-center">
    <div
        class="w-full md:w-2/6 py-10 mr-4 ml-4 border border-purple-400 border-t-[20px] border-b-4 border-b-purple-400 rounded-md shadow-md bg-white dark:bg-slate-900">
        <!-- Title -->
        <div class="text-center text-2xl md:text-3xl py-5 dark:text-gray-50">Reset Password</div>

        <!-- Subtitle -->
        <div class="text-center text-sm py-2 dark:text-gray-400 mb-4">Create new password</div>

        <!-- Form -->
        <form id="contact_us_form" (ngSubmit)="onSubmit()">
            <div class="space-y-5 ml-4 mr-4 px-3 md:px-0">
                <!-- Contacts -->
                <div class="relative">
                    <input [type]="showPassword ? 'text' : 'password'" name="newPassword" id="newPassword"
                        autocomplete="off"
                        class="px-4 py-2 peer w-full border border-purple-400 bg-gray-50 shadow-sm placeholder-transparent text-purple-600 focus:outline-none rounded-md focus:border-purple-600 focus:ring focus:ring-purple-300 focus:ring-opacity-50 dark:bg-slate-800 dark:text-gray-50"
                        placeholder="Enter Password" />
                    <label for="newPassword"
                        class="bg-gray-50 px-2 absolute left-2 -top-3.5 text-gray-600 text-sm transition-all peer-focus:-top-3 peer-focus:bg-gray-50 peer-placeholder-shown:top-2 peer-placeholder-shown:text-base peer-placeholder-shown:text-gray-400 dark:peer-focus:bg-slate-800 dark:bg-slate-800 dark:text-gray-50">
                        Password
                    </label>
                    <!-- Eye icon -->
                    <button type="button" (click)="showPassword = !showPassword"
                        class="absolute right-3 top-[1.3rem] transform -translate-y-1/2 text-gray-400 transition-colors duration-300 p-1 rounded-md text-purple-300">
                        @if(showPassword){
                        <span><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                                stroke="currentColor" class="w-5 h-5">
                                <path stroke-linecap="round" stroke-linejoin="round"
                                    d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
                                <path stroke-linecap="round" stroke-linejoin="round"
                                    d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                            </svg></span>
                        } @if (!showPassword) {
                        <span><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                                stroke="currentColor" class="w-5 h-5">
                                <path stroke-linecap="round" stroke-linejoin="round"
                                    d="M3.988 5.844A1.352 1.352 0 0 0 2.36 7.175l1.455 1.455A1.353 1.353 0 0 0 3.988 5.844ZM12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-1.232 0-2.435-.295-3.553-.84l4.244-4.243a3 3 0 1 0-4.243-4.243L3.988 5.844Z" />
                                <path stroke-linecap="round" stroke-linejoin="round"
                                    d="M14.25 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0ZM4.5 9.75l-1.5-1.5" />
                            </svg></span>
                        }
                    </button>
                </div>

                <!-- Contacts -->
                <div class="relative">
                    <input [type]="showConfirmPassword ? 'text' : 'password'" name="showConfirmPassword"
                        id="showConfirmPassword" autocomplete="off"
                        class="px-4 py-2 peer w-full border border-purple-400 bg-gray-50 shadow-sm placeholder-transparent text-purple-600 focus:outline-none rounded-md focus:border-purple-600 focus:ring focus:ring-purple-300 focus:ring-opacity-50 dark:bg-slate-800 dark:text-gray-50"
                        placeholder="Confirm Password" />
                    <label for="showConfirmPassword"
                        class="bg-gray-50 px-2 absolute left-2 -top-3.5 text-gray-600 text-sm transition-all peer-focus:-top-3 peer-focus:bg-gray-50 peer-placeholder-shown:top-2 peer-placeholder-shown:text-base peer-placeholder-shown:text-gray-400 dark:peer-focus:bg-slate-800 dark:bg-slate-800 dark:text-gray-50">
                        Confirm Password
                    </label>
                    <button type="button" (click)="showConfirmPassword = !showConfirmPassword"
                        class="absolute right-3 top-[1.3rem] transform -translate-y-1/2 text-gray-400 transition-colors duration-300 p-1 rounded-md text-purple-300">
                        @if(showConfirmPassword){
                        <span><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                                stroke="currentColor" class="w-5 h-5">
                                <path stroke-linecap="round" stroke-linejoin="round"
                                    d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
                                <path stroke-linecap="round" stroke-linejoin="round"
                                    d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                            </svg></span>
                        } @if (!showConfirmPassword) {
                        <span><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                                stroke="currentColor" class="w-5 h-5">
                                <path stroke-linecap="round" stroke-linejoin="round"
                                    d="M3.988 5.844A1.352 1.352 0 0 0 2.36 7.175l1.455 1.455A1.353 1.353 0 0 0 3.988 5.844ZM12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-1.232 0-2.435-.295-3.553-.84l4.244-4.243a3 3 0 1 0-4.243-4.243L3.988 5.844Z" />
                                <path stroke-linecap="round" stroke-linejoin="round"
                                    d="M14.25 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0ZM4.5 9.75l-1.5-1.5" />
                            </svg></span>
                        }
                    </button>
                </div>
                <!-- Going to the back screen / forward one -->
                <div class="flex space-x-4">
                    <button type="submit" [disabled]="resetForm.invalid || isLoading"
                        class="w-full rounded-md bg-purple-600 hover:bg-purple-700 hover:shadow-md py-3 text-white">
                        Reset
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>

<!-- Success Message Modal -->
@if (resetPasswordModal) {
<div class="fixed inset-0 bg-white bg-opacity-30 flex items-center justify-center z-50">
    <div class="rounded-lg shadow-xl max-w-md w-full mx-4 border border-gray-300 bg-white">
        <div class="p-6 text-center">
            @if (isSuccess) {
            <div>
                <h1 class="text-3xl font-bold text-black mb-2">Password Reset Successful</h1>
                <p class="text-sm text-gray-600 mb-6">{{ message }}</p>
                <!-- Combined click events into one handler -->
                <button (click)="navigateToLogin()"
                    class="px-4 py-2 bg-blue-400 hover:bg-indigo-500 text-white rounded-md transition-colors">
                    Close
                </button>
            </div>
            } @else {
            <!-- Error Content) -->
            <ng-container *ngTemplateOutlet="errorContent"></ng-container>
            }
        </div>
    </div>
</div>
}

<!-- Error Template -->
<ng-template #errorContent>
    <!-- Error Message -->
    <div>
        <h1 class="text-3xl font-bold text-black mb-2">Reset Failed</h1>
        <p class="text-sm text-gray-600 mb-6">{{ error }}</p>
        <button (click)="navigateToLogin()"
            class="px-4 py-2 bg-red-500 hover:bg-red-600 text-white rounded-md transition-colors">
            Close
        </button>
    </div>
</ng-template>
