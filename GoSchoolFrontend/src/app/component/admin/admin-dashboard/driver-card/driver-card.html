<!-- HTML with Custom Class Names -->
<button class="driver-card">
  <div class="driver-card-header">
    <img src="svg/profile.svg" class="driver-avatar" alt="profile">
    <p>{{ capitalize(driver.driverName) }} {{ capitalize(driver.driverSurname) }}</p>
  </div>

  <div class="driver-card-content">
    <div class="driver-badge driver-student-count">
      {{ driver.totalNumberOfStudents }}
    </div>
    <div class="driver-badge driver-contact">
      {{ driver.contact }}
    </div>
    
    <div class="driver-location">
      {{ capitalize(driver.driverLocation.province) }}
    </div>
  </div>
</button>
