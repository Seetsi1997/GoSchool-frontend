<header class="bg-white shadow-sm sticky top-0 z-40">
  <div class="flex items-center justify-between px-6 py-4">

    <!-- Left side -->
    <div class="flex items-center gap-4">

      <button  title="luc" class="lg:hidden p-2 hover:bg-gray-100 rounded-lg">
        <i class="lucide lucide-menu"></i>
      </button>

      <div class="relative hidden md:block">
        <i class="lucide lucide-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
        <input type="text" placeholder="Search..."
          class="pl-10 pr-4 py-2 bg-gray-100 rounded-lg focus:ring-2 focus:ring-purple-500 w-80" />
      </div>

    </div>

    <!-- Right side -->
    <div class="flex items-center gap-4">

      <button title="luc" class="relative p-2 hover:bg-gray-100 rounded-lg">
        <i class="lucide lucide-bell text-gray-600"></i>
        <span class="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full"></span>
      </button>

      <button title="luc" class="relative p-2 hover:bg-gray-100 rounded-lg">
        <i class="lucide lucide-mail text-gray-600"></i>
        <span class="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full"></span>
      </button>

      <div class="flex items-center gap-3 pl-4 border-l border-gray-200">
        <div class="w-10 h-10 bg-gradient-to-br from-purple-500 to-blue-600 rounded-full flex items-center justify-center text-white font-bold">
          JD
        </div>
        <div class="hidden sm:block">
          <div class="font-semibold text-gray-800 text-sm">John Doe</div>
          <div class="text-xs text-gray-500">Administrator</div>
        </div>
      </div>

    </div>

  </div>
</header>
