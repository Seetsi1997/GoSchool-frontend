<div class="mb-6">
  <h1 class="text-3xl font-bold text-gray-800 capitalize">Home</h1>
  <p class="text-gray-600 mt-1">Welcome back, John!</p>
</div>

<!-- Stats -->
<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">

  <div class="stat-card bg-white">
    <div class="flex justify-between mb-4">
      <div>
        <div class="text-3xl font-bold text-gray-800">1,504</div>
        <div class="text-sm text-gray-500">Total Users</div>
      </div>
      <div class="icon-circle bg-gradient-to-br from-purple-500 to-purple-600">
        <i class="lucide lucide-users"></i>
      </div>
    </div>
    <div class="text-green-500 text-sm font-medium">+12.5% from last month</div>
  </div>

</div>

<!-- Recent Orders -->
<div class="bg-white mt-6 rounded-xl shadow-sm border">
  <div class="p-6 border-b flex justify-between items-center bg-gradient-to-r from-gray-50">
    <h3 class="text-xl font-bold flex items-center">
      <i class="lucide lucide-shopping-cart mr-2 text-purple-600"></i>
      Recent Orders
    </h3>
    <button class="px-4 py-2 bg-purple-50 text-purple-600 rounded-lg">View All</button>
  </div>

  <div class="overflow-x-auto">
    <table class="w-full">
      <thead class="bg-gray-50">
        <tr>
          <th class="table-head">Order ID</th>
          <th class="table-head">Customer</th>
          <th class="table-head">Date</th>
          <th class="table-head">Amount</th>
          <th class="table-head">Status</th>
          <th class="table-head">Actions</th>
        </tr>
      </thead>

      <tbody class="divide-y">
        <tr class="hover:bg-purple-50">
          <td class="table-cell">#ORD-001</td>
          <td class="table-cell">John Smith</td>
          <td class="table-cell">15 Mar 2025</td>
          <td class="table-cell font-semibold">$125.00</td>
          <td class="table-cell">
            <span class="status-badge bg-green-100 text-green-700">Completed</span>
          </td>
          <td class="table-cell">
            <button class="text-purple-600">View</button>
          </td>
        </tr>
      </tbody>

    </table>
  </div>
</div>
