<!-- Overlay -->
<div
  class="fixed inset-0 bg-gradient-to-r from-[#3E4C70] via-[#547A8C] to-[#6D9CAB] z-50 flex items-center justify-center p-4">
  <!-- Modal Container -->
  <div class="bg-slate-500 rounded-2xl shadow-xl w-full max-w-md max-h-[90vh] overflow-hidden">
    <!-- Title -->
    <h1
      class="ml-6 text-[20px] font-semibold text-transparent bg-clip-text bg-gradient-to-r from-purple-200 to-purple-900 mt-4">
      Upload Proof of Payment
    </h1>

    <!-- Form Container -->
    <div class="w-full max-w-[650px] bg-slate-500 rounded-lg shadow-md">
      <form class="py-6 px-9">
        <!-- Upload Section -->
        <div class="mb-6 pt-4">
          <div class="flex items-center justify-between mb-5">
            <label for="upload" class="block text-[18px] font-semibold text-slate-200">
              Upload File
            </label>
          </div>

          <div class="mb-8">
            <input type="file" name="file" id="file" class="sr-only" />
            <label for="file"
              class="relative flex min-h-[200px] items-center justify-center rounded-md border border-dashed border-[#e0e0e0] p-12 text-center cursor-pointer hover:border-purple-400 transition">
              <div>
                <span class="mb-2 block font-semibold text-slate-200"> Drop files here </span>
                <span class="mb-2 block text-base font-medium text-purple-200"> Or </span>
                <span
                  class="inline-flex rounded border border-slate-100 py-2 px-7 text-base font-medium text-slate-200">
                  Browse
                </span>
              </div>
            </label>
          </div>

          <!-- File Preview -->
          <div class="mb-5 rounded-md bg-green-500 py-4 px-8 hidden" id="file-preview">
            <div class="flex items-center justify-between">
              <span class="truncate pr-3 text-base font-medium text-green-500" id="file-name">
                <!-- File name will appear here -->
              </span>
              <button type="button" class="text-black bg-blue-600">✕</button>
            </div>
          </div>
        </div>

        <!-- Action & Submit Button -->

        <div class="flex gap-3 pt-4">
          <button type="button" (click)="goBack()"
            class="flex-1 px-4 py-2 text-slate-100 border border-slate-300 rounded-lg transition-colors">
            Cancel
          </button>
          <button type="submit"
            class="flex-1 px-4 py-2 bg-purple-500 text-white rounded-lg hover:bg-purple-600 transition-colors disabled:bg-purple-600 disabled:cursor-not-allowed">
            Submit
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
