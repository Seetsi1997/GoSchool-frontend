<div class="bg-purple-300">

    <div class="h-screen flex overflow-hidden bg-slate-200">

        <!-- Sidebar -->
        <div class="absolute bg-slate-500 text-white w-56 min-h-screen overflow-y-auto transition-transform transform ease-in-out duration-300"
            [class.-translate-x-full]="!isSidebarOpen">
            <div class="p-4 border-b border-slate-300">
                <h1
                    class="text-2xl font-semibold text-transparent bg-clip-text bg-gradient-to-r from-purple-50 to-purple-500">
                    GoSchool
                </h1>
                <ul class="mt-4">
                    <li class="mb-2"><a href="#" class="block hover:text-indigo-100">Home</a></li>
                    <li class="mb-2"><a href="#" class="block hover:text-indigo-100">About</a></li>
                    <li class="mb-2"><a href="#" class="block hover:text-indigo-100">Services</a></li>
                    <li class="mb-2"><a href="#" class="block hover:text-indigo-100">Contact</a></li>
                </ul>
            </div>
            <ul class="mt-4 ml-4 flex flex-col gap-4">
                <li>
                    <a href="#"
                        class="flex items-center gap-2 text-slate-200 hover:text-indigo-100 transition-colors duration-200">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                            stroke="currentColor" class="h-6 w-6">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M12 9l-3 3m0 0l3 3m-3-3h12.75" />
                        </svg>
                        Logout
                    </a>
                </li>
            </ul>
        </div>

        <!-- Content -->
        <div class="flex-1 flex flex-col overflow-hidden">

            <!-- Navbar -->
            <div class="bg-slate-500 shadow">
                <div class="container mx-auto">
                    <div class="flex justify-between items-center py-4 px-2">
                        <h1
                            class="text-2xl font-semibold text-transparent bg-clip-text bg-gradient-to-r from-purple-50 to-purple-500">
                            GoSchool
                        </h1>

                        <button class="text-white" (click)="toggleSidebar($event)">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M4 6h16M4 12h16M4 18h16"></path>
                            </svg>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Content Body -->
            <div class="flex-1 overflow-auto p-4" (click)="closeSidebar()">
                <h1 class="text-2xl font-semibold">Welcome to our website</h1>
                <p>... Content goes here ...</p>
            </div>

        </div>
    </div>

</div>
