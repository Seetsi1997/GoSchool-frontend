<div class="bg-purple-300">
    <div
        class="h-screen flex overflow-hidden animated-background  bg-gradient-to-r from-[#3E4C70] via-[#547A8C] to-[#6D9CAB]">
        <!-- Sidebar -->
        <div class="absolute bg-gradient-to-r from-[#3E4C70] via-[#547A8C] to-[#6D9CAB] text-white w-56 min-h-screen overflow-y-auto transition-transform transform ease-in-out duration-300 z-[9999]"
            [class.-translate-x-full]="!isSidebarOpen">
            <div class="p-4 border-b border-slate-300">
                <h1
                    class="text-2xl font-semibold text-transparent bg-clip-text bg-gradient-to-r from-purple-50 to-purple-500">
                    GoSchool
                </h1>
                <ul class="mt-[60px] mb-4 flex flex-col gap-4">
                    <li class="mb-auto mt-auto">
                        <a (click)="setActive('home'); homeScreen()" [ngClass]="
                activeItem === 'home'
                  ? 'text-transparent font-semibold bg-clip-text bg-gradient-to-r from-purple-50 to-purple-500'
                  : 'text-slate-200 font-semibold'
              " class="flex items-center gap-2 transition-colors duration-200 cursor-pointer">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 20 20" stroke-width="1.3"
                                stroke="currentColor" class="h-6 w-6 text-slate-200">
                                <path
                                    d="M7.5 0.5L7.8254 0.120372C7.63815 -0.0401239 7.36185 -0.0401239 7.1746 0.120372L7.5 0.5ZM0.5 6.5L0.174604 6.12037L0 6.27003V6.5H0.5ZM5.5 14.5V15C5.77614 15 6 14.7761 6 14.5H5.5ZM9.5 14.5H9C9 14.7761 9.22386 15 9.5 15V14.5ZM14.5 6.5H15V6.27003L14.8254 6.12037L14.5 6.5ZM1.5 15H5.5V14H1.5V15ZM14.8254 6.12037L7.8254 0.120372L7.1746 0.879628L14.1746 6.87963L14.8254 6.12037ZM7.1746 0.120372L0.174604 6.12037L0.825396 6.87963L7.8254 0.879628L7.1746 0.120372ZM6 14.5V11.5H5V14.5H6ZM9 11.5V14.5H10V11.5H9ZM9.5 15H13.5V14H9.5V15ZM15 13.5V6.5H14V13.5H15ZM0 6.5V13.5H1V6.5H0ZM7.5 10C8.32843 10 9 10.6716 9 11.5H10C10 10.1193 8.88071 9 7.5 9V10ZM7.5 9C6.11929 9 5 10.1193 5 11.5H6C6 10.6716 6.67157 10 7.5 10V9ZM13.5 15C14.3284 15 15 14.3284 15 13.5H14C14 13.7761 13.7761 14 13.5 14V15ZM1.5 14C1.22386 14 1 13.7761 1 13.5H0C0 14.3284 0.671573 15 1.5 15V14Z"
                                    fill="#FFF1F1" />
                            </svg>
                            Home</a>
                    </li>
                    <li class="mb-2">
                        <a (click)="setActive('add'); addScreen()" [ngClass]="
                activeItem === 'add'
                  ? 'text-transparent font-semibold bg-clip-text bg-gradient-to-r from-purple-50 to-purple-500'
                  : 'text-slate-200 font-semibold'
              " class="flex items-center gap-2 transition-colors duration-200 cursor-pointer">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 20 20" stroke-width="1.3"
                                stroke="currentColor" class="h-6 w-6 text-slate-200">
                                <path d="M14 7v1H8v6H7V8H1V7h6V1h1v6h6z" />
                            </svg>Add</a>
                    </li>
                    <li class="mb-2">
                        <a (click)="setActive('settings'); settingsScreen()" [ngClass]="
                activeItem === 'settings'
                  ? 'text-transparent font-semibold bg-clip-text bg-gradient-to-r from-purple-50 to-purple-500'
                  : 'text-slate-200 font-semibold'
              " class="flex items-center gap-2 transition-colors duration-200 cursor-pointer">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 20 20" stroke-width="1.3"
                                stroke="currentColor" class="h-6 w-6 text-slate-200">
                                <path fill-rule="evenodd" clip-rule="evenodd"
                                    d="M3.5 2h-1v5h1V2zm6.1 5H6.4L6 6.45v-1L6.4 5h3.2l.4.5v1l-.4.5zm-5 3H1.4L1 9.5v-1l.4-.5h3.2l.4.5v1l-.4.5zm3.9-8h-1v2h1V2zm-1 6h1v6h-1V8zm-4 3h-1v3h1v-3zm7.9 0h3.19l.4-.5v-.95l-.4-.5H11.4l-.4.5v.95l.4.5zm2.1-9h-1v6h1V2zm-1 10h1v2h-1v-2z" />
                            </svg>
                            Settings</a>
                    </li>
                </ul>
            </div>
            <ul class="mt-4 ml-4 flex flex-col gap-4">
                <li>
                    <a (click)="setActive('logout'); openLogoutDialog()" [ngClass]="
                activeItem === 'logout'
                  ? 'text-transparent font-semibold bg-clip-text bg-gradient-to-r from-purple-50 to-purple-500'
                  : 'text-slate-200 font-semibold'
              " class="flex items-center gap-2 transition-colors duration-200 cursor-pointer"> <svg
                            xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 22 22" stroke-width="1.5"
                            stroke="currentColor" class="h-6 w-6 text-slate-200">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 
                             0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 
                             2.25 0 002.25-2.25V15M12 9l-3 3m0 0l3 3m-3-3h12.75" />
                        </svg>
                        Logout
                    </a>
                </li>
            </ul>
            <div class="flex items-center justify-between p-4 absolute top-[90%] left-0 transition-transform">
                <div class="flex items-center gap-4">
                    <!-- Icon -->
                    <svg width="25px" height="25px" viewBox="0 0 48 48" version="1" xmlns="http://www.w3.org/2000/svg"
                        enable-background="new 0 0 48 48">
                        <polygon fill="#FFF1F1"
                            points="24,3 28.7,6.6 34.5,5.8 36.7,11.3 42.2,13.5 41.4,19.3 45,24 41.4,28.7 42.2,34.5 36.7,36.7 34.5,42.2 28.7,41.4 24,45 19.3,41.4 13.5,42.2 11.3,36.7 5.8,34.5 6.6,28.7 3,24 6.6,19.3 5.8,13.5 11.3,11.3 13.5,5.8 19.3,6.6" />
                        <polygon fill="#80A1BA" points="34.6,14.6 21,28.2 15.4,22.6 12.6,25.4 21,33.8 37.4,17.4" />
                    </svg>
                    <!-- Label -->
                    <span class="text-[#FFF1F1] font-medium">APPVERSION</span>
                </div>
                <!-- Version Number -->
                <p class="text-[#FFCF71] ml-4">1.1.0</p>
            </div>
        </div>

        <!-- Content -->
        <div class="flex-1 flex flex-col overflow-hidden">
            <!-- Navbar -->
            <div class="bg-gradient-to-l from-[#CCFB] to-[#CCF1] shadow">
                <div class="container mx-auto">
                    <div class="flex justify-between items-center py-4 px-2">
                        <h1
                            class="text-2xl font-semibold text-transparent bg-clip-text bg-gradient-to-r from-purple-50 to-purple-500">
                            GoSchool
                        </h1>

                        <button type="button" title="sidebar" class="text-white" (click)="toggleSidebar($event)">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M4 6h16M4 12h16M4 18h16"></path>
                            </svg>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Content Body -->
            <div class="flex-1 overflow-auto p-4" (click)="closeSidebar()">
                <router-outlet></router-outlet>
            </div>
        </div>
    </div>
</div>

<app-logout class="inset-0 flex items-center justify-center z-50"></app-logout>
