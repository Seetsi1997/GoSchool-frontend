<!-- Overlay -->
<div class="overlay" [class.active]="isOpen" (click)="toggleSidebar()"></div>

<!-- Sidebar -->
<div class="sidebar" [class.active]="isOpen">
  <!-- Profile Header -->
    <div class="profile-header">
        <!-- Profile items row -->
        <div class="profile-items-row">
            <a *ngFor="let item of profileItems" 
               (click)="onMenuItemClick(item.id)"
               [class.active]="activeItem === item.id"
               class="profile-item">
                <div class="menu-icon" [innerHTML]="item.svg"></div>
                <span class="menu-text">{{ item.text }}</span>
            </a>
        </div>
        
        <!-- Welcome text below -->
        <h2>Welcome, {{ displayName }}</h2>
        <p>{{ email || 'test@gmail.com' }}</p>
    </div>


  <!-- Menu Items -->
  <div class="menu-section">
    <a 
      *ngFor="let item of menuItems"
      (click)="onMenuItemClick(item.id)"
      class="menu-item" 
      [class.active]="activeItem === item.id"
    >
      <div class="menu-icon" [innerHTML]="item.svg"></div>
      <span class="menu-text">{{ item.text }}</span>
      <span class="menu-arrow">›</span>
    </a>
  </div>

  <!-- Settings Section -->
  <div class="settings-section">
    <a 
      *ngFor="let item of logoutItems"
      (click)="onMenuItemClick(item.id)"
      class="menu-item" 
      [class.active]="activeItem === item.id"
    >
      <div class="menu-icon" [innerHTML]="item.svg"></div>
      <span class="menu-text">{{ item.text }}</span>
      <span class="menu-arrow">›</span>
    </a>
  </div>

  <!-- Version Info -->
  <div class="version-info">
    <div class="version-icon">
      <svg
        width="25px"
        height="25px"
        viewBox="0 0 48 48"
        version="1"
        xmlns="http://www.w3.org/2000/svg"
        enable-background="new 0 0 48 48"
      >
        <polygon
          fill="#FFF1F1"
          points="24,3 28.7,6.6 34.5,5.8 36.7,11.3 42.2,13.5 41.4,19.3 45,24 41.4,28.7 42.2,34.5 36.7,36.7 34.5,42.2 28.7,41.4 24,45 19.3,41.4 13.5,42.2 11.3,36.7 5.8,34.5 6.6,28.7 3,24 6.6,19.3 5.8,13.5 11.3,11.3 13.5,5.8 19.3,6.6"
        />
        <polygon
          fill="#80A1BA"
          points="34.6,14.6 21,28.2 15.4,22.6 12.6,25.4 21,33.8 37.4,17.4"
        />
      </svg>
    </div>
    <span class="version-text">APPVERSION</span>
    <span class="version-number">1.1.0</span>
  </div>
</div>
