<!-- Overlay -->
<div class="fixed inset-0 bg-gradient-to-r from-[#3E4C70] via-[#547A8C] to-[#6D9CAB] z-50 flex items-center justify-center p-4">
    <!-- Modal Container -->
    <div class="bg-slate-500 rounded-2xl shadow-xl w-full max-w-md max-h-[90vh] overflow-hidden">
        <!-- Header -->
        <div class="flex items-center justify-between p-4 border-b border-gray-200">
            <h2 class="text-xl font-semibold text-slate-100">Transactions History</h2>
            <button type="button" title="close" (click)="goBack()" class="text-purple-300 transition-colors">
                <svg class="w-5 h-5 bg-clip-text bg-gradient-to-r from-purple-200 to-purple-900" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>

        <!-- Content -->
        <div class="p-6 overflow-y-auto max-h-[calc(90vh-80px)]">
            <div class="space-y-6">
                <h2 class="text-xl font-semibold text-slate-100">Student Transaction Info</h2>

                <!-- No Transactions Message -->
                <div class="text-center py-8">
                    <div class="flex flex-col items-center justify-center">
                        <svg xmlns="http://www.w3.org/2000/svg" height="34px" viewBox="0 -960 960 960" width="34px" fill="#6D9C"><path d="m787-145 28-28-75-75v-112h-40v128l87 87Zm-587 25q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h560q33 0 56.5 23.5T840-760v268q-19-9-39-15.5t-41-9.5v-243H200v560h242q3 22 9.5 42t15.5 38H200Zm0-120v40-560 243-3 280Zm80-40h163q3-21 9.5-41t14.5-39H280v80Zm0-160h244q32-30 71.5-50t84.5-27v-3H280v80Zm0-160h400v-80H280v80ZM720-40q-83 0-141.5-58.5T520-240q0-83 58.5-141.5T720-440q83 0 141.5 58.5T920-240q0 83-58.5 141.5T720-40Z"/></svg>
                        <h3 class="text-lg font-semibold text-white mb-2">No Transactions Found</h3>
                        <p class="text-slate-300">Once the transport student has been located, your transaction history will appear here.</p>
                    </div>
                </div>

                <!-- Compact Grid Layout (Hidden when no transactions) -->
                <!--
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="space-y-4">
                        Transaction items would go here
                    </div>
                </div>
                -->

                <!-- Action Buttons -->
                <div class="flex gap-3 pt-4">
                    <button (click)="goBack()"
                        class="flex-1 px-4 py-2 text-slate-100 border border-slate-300 rounded-lg transition-colors">
                        Close
                    </button>
                </div>
            </div>
            <router-outlet></router-outlet>
        </div>
    </div>
</div>
