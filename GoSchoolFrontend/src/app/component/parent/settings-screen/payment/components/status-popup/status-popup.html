<div *ngIf="show" class="fixed inset-0 bg-gradient-to-r from-[#3E4C70] via-[#547A8C] to-[#6D9CAB] bg-opacity-50 z-[60] flex items-center justify-center p-4">
  <div class="bg-slate-500 rounded-2xl shadow-xl w-full max-w-sm mx-auto transform transition-all">
    <!-- Header -->
    <div class="flex items-center justify-between p-4 border-b border-gray-200">
      <div class="flex items-center space-x-2">
        <!-- Success Icon -->
        <div *ngIf="type === 'success'"
          class="w-6 h-6 bg-green-500 text-slate-100 rounded-full flex items-center justify-center">
          <span class="text-white text-sm font-bold">✓</span>
        </div>
        <!-- Error Icon -->
        <div *ngIf="type === 'error'" class="w-6 h-6 bg-red-500 rounded-full flex items-center justify-center">
          <span class="text-red-500 text-sm font-bold">!</span>
        </div>
        <!-- Info Icon -->
        <div *ngIf="type === 'info'"
           class="w-6 h-6 bg-blue-500   text-slate-100 rounded-full flex items-center justify-center">
          <span class="text-slate-100 text-sm font-bold">i</span>
        </div>
        <h3 class="text-lg font-semibold text-slate-100">{{ title }}</h3>
      </div>
    </div>

    <!-- Content -->
    <div class="p-4">
      <p class="text-slate-100">{{ message }}</p>
    </div>

    <!-- Actions -->
    <div class="flex justify-end p-4 border-t border-gray-200">
     <button (click)="onClose()" [ngClass]="{
          'bg-green-500 hover:bg-green-600': type === 'success',
          'bg-red-500 hover:bg-red-600': type === 'error',
          'bg-blue-500 hover:bg-blue-600': type === 'info'
        }" class="flex-1 px-4 py-2 bg-purple-500 text-white rounded-lg hover:bg-purple-600 transition-colors">
        OK
      </button>
    </div>
  </div>
</div>
