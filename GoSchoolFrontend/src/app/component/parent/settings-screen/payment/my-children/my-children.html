<!-- Main Overlay -->
<div class="fixed inset-0 bg-gradient-to-r from-[#3E4C70] via-[#547A8C] to-[#6D9CAB] z-50 flex items-center justify-center p-4">
  <!-- Modal Container -->
  <div class="bg-slate-500 rounded-2xl shadow-xl w-full max-w-4xl max-h-[90vh] overflow-hidden">
    <!-- Header -->
    <div class="flex items-center justify-between p-4 border-b border-gray-200">
      <h2 class="text-xl font-semibold text-slate-100">Student Details</h2>
      <button type="button" title="goBack" (click)="goBack()" class="text-purple-300 transition-colors">
        <svg class="w-5 h-5 bg-clip-text bg-gradient-to-r from-purple-200 to-purple-900" fill="none"
          stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <!-- Content -->
    <div class="p-6 overflow-y-auto max-h-[calc(90vh-80px)]">
      <app-student-list
        [students]="students"
        [isLoading]="isLoading"
        [error]="error"
        [loadingMessage]="loadingMessage"
        (studentSelected)="showStudentDetail($event)">
      </app-student-list>

      <!-- Action Buttons -->
      <div class="flex gap-3 pt-4">
        <button (click)="goBack()"
          class="flex-1 px-4 py-2 text-slate-100 border border-slate-300 rounded-lg transition-colors">
          Close
        </button>
      </div>
      <router-outlet></router-outlet>
    </div>
  </div>
</div>

<!-- Student Detail Popup -->
<app-student-detail
  *ngIf="selectedStudent"
  [student]="selectedStudent"
  [availableGrades]="availableGrades"
  (close)="closeStudentDetail()"
  (edit)="openEditPopup($event)">
</app-student-detail>

<!-- Edit Student Popup -->
<app-edit-student
  *ngIf="showEditPopup && studentToEdit"
  [student]="studentToEdit"
  [availableGrades]="availableGrades"
  [isSaving]="isSaving"
  (save)="saveStudentChanges()"
  (close)="closeEditPopup()">
</app-edit-student>

<!-- Status Popup -->
<app-status-popup
  [show]="showPopup"
  [title]="popupTitle"
  [message]="popupMessage"
  [type]="popupType"
  (closed)="closePopup()">
</app-status-popup>
