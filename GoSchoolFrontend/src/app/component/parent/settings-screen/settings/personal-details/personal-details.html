<!-- Overlay -->
<div class="fixed inset-0 bg-gradient-to-r from-[#3E4C70] via-[#547A8C] to-[#6D9CAB] z-50 flex items-center justify-center p-4">
    <!-- Modal Container -->
    <div class="bg-slate-500 rounded-2xl shadow-xl w-full max-w-md max-h-[90vh] overflow-hidden">
        <!-- Header -->
        <div class="flex items-center justify-between p-4 border-b border-gray-200">
            <h2 class="text-xl font-semibold text-slate-100">Personal Details Setting</h2>
            <button type="button" title="goBack" (click)="goBack()"
               class="text-purple-300 transition-colors">
              <svg class="w-5 h-5 bg-clip-text bg-gradient-to-r from-purple-200 to-purple-900" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>

        <!-- Content -->
        <div class="p-6 overflow-y-auto max-h-[calc(90vh-80px)]">
            <div class="space-y-6">
                <h2 class="text-xl font-semibold text-slate-100">Parents Info</h2>

                <!-- Compact Grid Layout -->
                <div class="grid grid-cols-1 md:grid-cols-1 gap-4">
                    <!-- Column 1 -->
                    <div class="space-y-4">
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label for="fullName" class="block text-sm font-medium text-slate-100 mb-1">Full
                                    Name</label>
                                <input type="text" id="fullName" [value]="capitalizeRole(parent.firstName)" readonly
                                    class="px-4 py-2 peer w-full border border-slate-300 bg-gray-50 shadow-sm placeholder-transparent text-purple-600 focus:outline-none rounded-md focus:border-purple-600 focus:ring focus:ring-purple-300 focus:ring-opacity-50 dark:bg-slate-500 dark:text-gray-50" />
                            </div>
                            <div>
                                <label for="surname"
                                    class="block text-sm font-medium text-slate-100 mb-1">Surname</label>
                                <input type="text" id="surname" [value]="capitalizeRole(parent.surname)" readonly
                                    class="px-4 py-2 peer w-full border border-slate-300 bg-gray-50 shadow-sm placeholder-transparent text-purple-600 focus:outline-none rounded-md focus:border-purple-600 focus:ring focus:ring-purple-300 focus:ring-opacity-50 dark:bg-slate-500 dark:text-gray-50" />
                            </div>
                        </div>
                        <div>
                            <label for="email" class="block text-sm font-medium text-slate-100 mb-1">Email
                                Address</label>
                            <input type="email" id="email" [(ngModel)]="parent.email" readonly
                                class="px-4 py-2 peer w-full border border-slate-300 bg-gray-50 shadow-sm placeholder-transparent text-purple-600 focus:outline-none rounded-md focus:border-purple-600 focus:ring focus:ring-purple-300 focus:ring-opacity-50 dark:bg-slate-500 dark:text-gray-50" />
                        </div>
                        <div>
                            <label for="phoneNumber" class="block text-sm font-medium text-slate-100 mb-1">Phone
                                Number</label>
                            <input type="tel" id="phoneNumber" [(ngModel)]="parent.contact" readonly
                                class="px-4 py-2 peer w-full border border-slate-300 bg-gray-50 shadow-sm placeholder-transparent text-purple-600 focus:outline-none rounded-md focus:border-purple-600 focus:ring focus:ring-purple-300 focus:ring-opacity-50 dark:bg-slate-500 dark:text-gray-50" />
                        </div>
                        <div>
                            <label for="suburb" class="block text-sm font-medium text-slate-100 mb-1">Suburb</label>
                            <input type="text" id="suburb" [value]="capitalizeRole(parent.suburb)" readonly
                                class="px-4 py-2 peer w-full border border-slate-300 bg-gray-50 shadow-sm placeholder-transparent text-purple-600 focus:outline-none rounded-md focus:border-purple-600 focus:ring focus:ring-purple-300 focus:ring-opacity-50 dark:bg-slate-500 dark:text-gray-50" />
                        </div>
                        <div>
                            <label for="city" class="block text-sm font-medium text-slate-100 mb-1">City</label>
                            <input type="text" id="city" [value]="capitalizeRole(parent.city)" readonly
                                class="px-4 py-2 peer w-full border border-slate-300 bg-gray-50 shadow-sm placeholder-transparent text-purple-600 focus:outline-none rounded-md focus:border-purple-600 focus:ring focus:ring-purple-300 focus:ring-opacity-50 dark:bg-slate-500 dark:text-gray-50" />
                        </div>
                    </div>

                    <!-- Column 2 -->
                    <div class="space-y-4">
                        <div>
                            <label for="streetAddress"
                                class="block text-sm font-medium text-slate-100 mb-1">Street Address</label>
                            <input type="text" id="streetAddress" [value]="capitalizeRole(parent.address)" readonly
                                class="px-4 py-2 peer w-full border border-slate-300 bg-gray-50 shadow-sm placeholder-transparent text-purple-600 focus:outline-none rounded-md focus:border-purple-600 focus:ring focus:ring-purple-300 focus:ring-opacity-50 dark:bg-slate-500 dark:text-gray-50" />
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label for="postalCode" class="block text-sm font-medium text-slate-100 mb-1">Postal
                                    Code</label>
                                <input type="text" id="postalCode" [(ngModel)]="parent.postalCode" readonly
                                    class="px-4 py-2 peer w-full border border-slate-300 bg-gray-50 shadow-sm placeholder-transparent text-purple-600 focus:outline-none rounded-md focus:border-purple-600 focus:ring focus:ring-purple-300 focus:ring-opacity-50 dark:bg-slate-500 dark:text-gray-50" />
                            </div>
                            <div>
                                <label for="province"
                                    class="block text-sm font-medium text-slate-100 mb-1">Province</label>
                                <input type="text" id="province" [value]="capitalizeRole(parent.province)" readonly
                                    class="px-4 py-2 peer w-full border border-slate-300 bg-gray-50 shadow-sm placeholder-transparent text-purple-600 focus:outline-none rounded-md focus:border-purple-600 focus:ring focus:ring-purple-300 focus:ring-opacity-50 dark:bg-slate-500 dark:text-gray-50" />
                            </div>
                        </div>
                        <div class="flex justify-end mt-0">
                            <button type="button" title="location" (click)="openReLocation()"
                                class="flex items-center gap-2 bg-purple-500 text-white px-6 py-2 rounded-lg hover:bg-purple-600 transition-colors">
                                <svg class="w-4 h-4 text-slate-200" fill="none" stroke="currentColor"
                                    viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Role (Full Width) -->
                <div class="grid grid-cols-1 md:grid-cols-1 gap-4">
                    <div class="pb-2">
                        <label for="role" class="block text-sm font-medium text-slate-100 mb-1">Role</label>
                        <input type="text" id="role" [value]="capitalizeRole(parent!.role)" readonly
                            class="px-4 py-2 peer w-full border border-slate-300 bg-gray-50 shadow-sm placeholder-transparent text-purple-600 focus:outline-none rounded-md focus:border-purple-600 focus:ring focus:ring-purple-300 focus:ring-opacity-50 dark:bg-slate-500 dark:text-gray-50" />
                    </div>
                </div>
        
                <!-- Action Buttons -->
                <div class="flex gap-3 pt-4">
                    <button (click)="goBack()"
                        class="flex-1 px-4 py-2 text-slate-100 border border-slate-300 rounded-lg transition-colors">
                        Close
                    </button>
                </div>
            </div>
            <router-outlet></router-outlet>
        </div>
    </div>
</div>
