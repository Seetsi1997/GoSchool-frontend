<!-- Overlay -->
<div class="fixed inset-0 bg-slate-200 z-50 flex items-center justify-center p-4">
    <!-- Modal Container -->
    <div class="bg-slate-500 rounded-2xl shadow-xl w-full max-w-md max-h-[90vh] overflow-hidden">
        <!-- Header -->
        <div class="flex items-center justify-between p-4 border-b border-gray-200">
            <h2 class="text-xl font-semibold text-slate-100">Update Location</h2>
            <button type="button" (click)="goBack()" class="text-gray-400 hover:text-gray-600 transition-colors">
                <svg class="w-6 h-6 text-slate-100" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>

        <!-- Content -->
        <div class="p-6 overflow-y-auto max-h-[calc(90vh-80px)]">
            <div class="space-y-4">
                <!-- Form Fields -->
                <div class="space-y-4">
                    <!-- Column 1 -->
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-100 mb-1">City</label>
                            <input type="text" [(ngModel)]="parent.city"
                                class="px-4 py-2 peer w-full border border-slate-300 bg-gray-50 shadow-sm placeholder-transparent text-purple-600 focus:outline-none rounded-md focus:border-purple-600 focus:ring focus:ring-purple-300 focus:ring-opacity-50 dark:bg-slate-500 dark:text-gray-50" />
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-100 mb-1">Address</label>
                            <input type="text" [(ngModel)]="parent.address"
                                class="px-4 py-2 peer w-full border border-slate-300 bg-gray-50 shadow-sm placeholder-transparent text-purple-600 focus:outline-none rounded-md focus:border-purple-600 focus:ring focus:ring-purple-300 focus:ring-opacity-50 dark:bg-slate-500 dark:text-gray-50" />
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div> 
                                <label class="block text-sm font-medium text-slate-100 mb-1">Postal Code</label>
                                <input type="text" [(ngModel)]="parent.postalCode"
                                    class="pl-2 pr-2 py-2 peer w-full border border-slate-300 bg-gray-50 shadow-sm placeholder-transparent text-purple-600 focus:outline-none rounded-md focus:border-purple-600 focus:ring focus:ring-purple-300 focus:ring-opacity-50 dark:bg-slate-500 dark:text-gray-50" />
                            </div>

                            <div>
                                <label class="flex text-sm font-medium text-slate-100 mb-1">Province</label>
                                <select [(ngModel)]="parent.province" name="province"
                                    class="px-1 py-[0.6rem] peer w-full border border-slate-300 bg-gray-50 shadow-sm placeholder-transparent text-purple-600 focus:outline-none rounded-md focus:border-purple-600 focus:ring focus:ring-purple-300 focus:ring-opacity-50 dark:bg-slate-500 dark:text-gray-50">
                                    <option value="" disabled>Select a Province</option>
                                    <option *ngFor="let province of provinces" [value]="province">
                                        {{ province.replace(' ', ' ') }}
                                    </option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- Action Buttons -->
                    <div class="flex gap-3 pt-4">
                        <button (click)="goBack()"
                            class="flex-1 px-4 py-2 text-slate-100 border border-slate-300 rounded-lg transition-colors">
                            Cancel
                        </button>
                        <button (click)="saveChanges()"
                            class="flex-1 px-4 py-2 bg-purple-500 text-white rounded-lg hover:bg-purple-600 transition-colors">
                            Save Changes
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Centered Popup Overlay -->
    <div *ngIf="showPopup" class="fixed inset-0 bg-slate-200 bg-opacity-50 z-[60] flex items-center justify-center p-4">
        <div class="bg-slate-500 rounded-2xl shadow-xl w-full max-w-sm mx-auto transform transition-all">
            <!-- Header -->
            <div class="flex items-center justify-between p-4 border-b border-gray-200">
                <div class="flex items-center space-x-2">
                    <!-- Success Icon -->
                    <div *ngIf="popupType === 'success'"
                        class="w-6 h-6 bg-green-500 text-slate-100 rounded-full flex items-center justify-center">
                        <span class="text-white text-sm font-bold">✓</span>
                    </div>
                    <!-- Error Icon -->
                    <div *ngIf="popupType === 'error'"
                        class="w-6 h-6 bg-red-500 rounded-full flex items-center justify-center">
                        <span class="text-red-500 text-sm font-bold">!</span>
                    </div>
                    <!-- Info Icon -->
                    <div *ngIf="popupType === 'info'"
                        class="w-6 h-6 bg-blue-500 text-slate-100 rounded-full flex items-center justify-center">
                        <span class="text-slate-100 text-sm font-bold">i</span>
                    </div>
                    <h3 class="text-lg font-semibold text-slate-100">{{ popupTitle }}</h3>
                </div>
            </div>

            <!-- Content -->
            <div class="p-4">
                <p class="text-slate-100">{{ popupMessage }}</p>
            </div>

            <!-- Actions -->
            <div class="flex justify-end p-4 border-t border-gray-200">
                <button (click)="closePopup()" [ngClass]="{
            'bg-green-500 hover:bg-green-600': popupType === 'success',
            'bg-red-500 hover:bg-red-600': popupType === 'error',
            'bg-blue-500 hover:bg-blue-600': popupType === 'info'
          }" class="flex-1 px-4 py-2 bg-purple-500 text-white rounded-lg hover:bg-purple-600 transition-colors">
                    OK
                </button>
            </div>
        </div>
    </div>
</div>
