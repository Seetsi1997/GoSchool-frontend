<!-- Overlay -->
<div class="fixed inset-0 bg-gradient-to-r from-[#3E4C70] via-[#547A8C] to-[#6D9CAB] z-50 flex items-center justify-center p-4">
    <!-- Modal Container -->
    <div class="bg-slate-500 rounded-2xl shadow-xl w-full max-w-md max-h-[90vh] overflow-hidden">
        <!-- Header -->
        <div class="flex items-center justify-between p-4 border-b border-gray-200">
            <h2 class="text-xl font-semibold text-slate-100">Change Password</h2>
            <button type="button" (click)="goBack()" title="Close" aria-label="Close" class="text-purple-300 transition-colors">
                <svg class="w-5 h-5 bg-clip-text bg-gradient-to-r from-purple-200 to-purple-900" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>

        <!-- Content -->
        <div class="p-6 overflow-y-auto max-h-[calc(90vh-80px)]">
            <form [formGroup]="passwordForm" (ngSubmit)="onSubmit()">
                <div class="space-y-6">
                    <h2 class="text-xl font-semibold text-slate-100">Type a Password of Your Choice.</h2>

                    <!-- Message Display -->
                    <div *ngIf="message" 
                         [class]="messageType === 'success' ? 'bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded' : 'bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded'">
                        {{ message }}
                    </div>

                    <!-- Compact Grid Layout -->
                    <div class="grid grid-cols-1 md:grid-cols-1 gap-4">
                        <!-- Column 1 -->
                        <div class="space-y-4">
                            <!-- Current Password -->
                            <div>
                                <label for="currentPassword" class="block text-sm font-medium text-slate-100 mb-1">
                                    Current Password
                                </label>
                                <div class="relative">
                                    <input 
                                        [type]="getPasswordFieldType('current')" 
                                        id="currentPassword" 
                                        formControlName="currentPassword"
                                        class="px-4 py-2 pr-10 w-full border border-slate-300 bg-gray-50 shadow-sm text-purple-600 focus:outline-none rounded-md focus:border-purple-600 focus:ring focus:ring-purple-300 focus:ring-opacity-50 dark:bg-slate-500 dark:text-gray-50" />
                                    <button 
                                        type="button"  title="old password"
                                        (click)="togglePasswordVisibility('current')"
                                        class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-600 dark:text-gray-400">
                                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <ng-container *ngIf="showCurrentPassword; else showIcon">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
                                            </ng-container>
                                            <ng-template #showIcon>
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                                            </ng-template>
                                        </svg>
                                    </button>
                                </div>
                                <div *ngIf="currentPassword?.invalid && currentPassword?.touched" class="text-red-300 text-sm mt-1">
                                    Current password is required
                                </div>
                            </div>

                            <!-- New Password -->
                            <div>
                                <label for="newPassword" class="block text-sm font-medium text-slate-100 mb-1">
                                    New Password
                                </label>
                                <div class="relative">
                                    <input 
                                        [type]="getPasswordFieldType('new')" 
                                        id="newPassword"
                                        formControlName="newPassword"
                                        class="px-4 py-2 pr-10 w-full border border-slate-300 bg-gray-50 shadow-sm text-purple-600 focus:outline-none rounded-md focus:border-purple-600 focus:ring focus:ring-purple-300 focus:ring-opacity-50 dark:bg-slate-500 dark:text-gray-50" />
                                    <button 
                                        type="button"  title="new password"
                                        (click)="togglePasswordVisibility('new')"
                                        class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-600 dark:text-gray-400">
                                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <ng-container *ngIf="showPassword; else showIcon">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
                                            </ng-container>
                                            <ng-template #showIcon>
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                                            </ng-template>
                                        </svg>
                                    </button>
                                </div>
                                <div *ngIf="newPassword?.invalid && newPassword?.touched" class="text-red-300 text-sm mt-1">
                                    <div *ngIf="newPassword?.errors?.['required']">New password is required</div>
                                    <div *ngIf="newPassword?.errors?.['minlength']">Password must be at least 6 characters</div>
                                </div>
                            </div>

                            <!-- Confirm Password -->
                            <div>
                                <label for="confirmPassword" class="block text-sm font-medium text-slate-100 mb-1">
                                    Confirm Password
                                </label>
                                <div class="relative">
                                    <input 
                                        [type]="getPasswordFieldType('confirm')" 
                                        id="confirmPassword"
                                        formControlName="confirmPassword"
                                        class="px-4 py-2 pr-10 w-full border border-slate-300 bg-gray-50 shadow-sm text-purple-600 focus:outline-none rounded-md focus:border-purple-600 focus:ring focus:ring-purple-300 focus:ring-opacity-50 dark:bg-slate-500 dark:text-gray-50" />
                                    <button 
                                        type="button" title="confirm new password"
                                        (click)="togglePasswordVisibility('confirm')"
                                        class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-600 dark:text-gray-400">
                                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <ng-container *ngIf="showConfirmPassword; else showIcon">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"  d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
                                            </ng-container>
                                            <ng-template #showIcon>
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"  d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"  d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                                            </ng-template>
                                        </svg>
                                    </button>
                                </div>
                                <div *ngIf="confirmPassword?.invalid && confirmPassword?.touched" class="text-red-300 text-sm mt-1">
                                    Confirm password is required
                                </div>
                                <div *ngIf="passwordForm.errors?.['passwordMismatch'] && confirmPassword?.touched" class="text-red-300 text-sm mt-1">
                                    Passwords do not match
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="flex gap-3 pt-6">
                    <button 
                        type="button"
                        (click)="goBack()"
                        [disabled]="isLoading"
                        class="flex-1 px-4 py-2 text-slate-100 border border-slate-300 rounded-lg transition-colors disabled:opacity-50">
                        Cancel
                    </button>
                    <button 
                        type="submit"
                        [disabled]="passwordForm.invalid || isLoading"
                        class="flex-1 px-4 py-2 bg-purple-500 text-white rounded-lg hover:bg-purple-600 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                        <span *ngIf="!isLoading">Confirm</span>
                        <span *ngIf="isLoading">Changing...</span>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
