<div class="w-full max-w-md mx-auto p-0">

          <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
        </svg>

    </div>

        <svg fill="#FFF1F1" width="20px" height="20px" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">

        <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />

  <!-- Support Title -->
  <h1 class="text-2xl font-semibold text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-purple-500 mt-4">
    Support
  </h1>

  <div class="bg-slate-500 shadow-md rounded-2xl divide-y mt-4 divide-slate-100">
    <!-- Row 1 - Change Password -->
    <div class="flex items-center justify-between p-4 cursor-pointer" (click)="openChangePassword()">
      <div class="flex items-center gap-3">
        <!-- Icon -->
        <svg fill="#FFF1F1" width="18px" height="18px" viewBox="-2 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="m3.5 6.5v3.5h-1.5c-1.105 0-2 .895-2 2v10c0 1.105.895 2 2 2h16c1.105 0 2-.895 2-2v-10c0-1.105-.895-2-2-2h-1.5v-3.5c0-3.59-2.91-6.5-6.5-6.5s-6.5 2.91-6.5 6.5zm2.5 3.5v-3.5c0-2.209 1.791-4 4-4s4 1.791 4 4v3.5zm2 5.5c0-1.105.895-2 2-2s2 .895 2 2c0 .701-.361 1.319-.908 1.676l-.008.005s.195 1.18.415 2.57v.001c0 .414-.335.749-.749.749-.001 0-.001 0-.002 0h-1.499-.001c-.414 0-.749-.335-.749-.749v-.001l.415-2.57c-.554-.361-.916-.979-.916-1.68z"/>
        </svg>
        <!-- Label -->
        <span class="text-[#FFF1F1] font-medium">Change Password</span>
      </div>
      <!-- Next Icon -->
      <svg class="w-5 h-5 text-[#FFF1F1]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
      </svg>
    </div>

    <!-- Row 2 - T&Cs and Privacy -->
    <div class="flex items-center justify-between p-4 cursor-pointer" (click)="openTermsAndPrivacy()">
      <div class="flex items-center gap-3">
        <!-- Icon -->
        <svg class="w-6 h-6 text-[#FFF1F1]" fill="currentColor" viewBox="0 0 24 24">
          <path d="M12 1a11 11 0 100 22 11 11 0 000-22zM11 6h2v7h-2V6zm0 9h2v2h-2v-2z" />
        </svg>
        <!-- Label -->
        <span class="text-[#FFF1F1] font-medium">T&Cs and privacy</span>
      </div>
      <!-- Next Icon -->
      <svg class="w-5 h-5 text-[#FFF1F1]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
      </svg>
    </div>

    <!-- Row 3 - App Version (No navigation) -->
    <div class="flex items-center justify-between p-4">
      <div class="flex items-center gap-3">
        <!-- Icon -->
        <svg width="25px" height="25px" viewBox="0 0 48 48" version="1" xmlns="http://www.w3.org/2000/svg" enable-background="new 0 0 48 48">

          <polygon fill="#80A1BA" points="34.6,14.6 21,28.2 15.4,22.6 12.6,25.4 21,33.8 37.4,17.4"/>
        </svg>
        <!-- Label -->
        <span class="text-[#FFF1F1] font-medium">APPVERSION</span>
      </div>
      <!-- Version Number -->
      <p class="text-[#FFCF71]">1.1.0</p>
    </div>
  </div>
  
  <div class="main-content">
    <!-- This outlet will show either SettingsScreen OR Profile, etc. -->
    <router-outlet></router-outlet>
  </div>
</div>
